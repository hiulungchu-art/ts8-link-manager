<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">
<title>FSI 暫停管理 · 工作頁面集</title>
<link rel="stylesheet" href="./css/site.css?v=20260914fsi7">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="./config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+TC:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap');
:root{
  --ink:#0F1612;--ink-2:#16201A;--cream:#F3EEE4;--cream-2:#EAE3D6;--paper:#FAF7F1;--line:#DDD5C8;--line-soft:#E8E1D4;
  --text:#1E2622;--mute:#6A736C;--accent:#5C8A72;--accent-d:#3F6B56;--accent-glow:rgba(92,138,114,.22);
  --ok:#2F7A55;--okb:#E6F4EC;--warn:#9A6B2F;--warnb:#F8F0E4;--info:#3A6E8C;--infob:#E8F1F6;--danger:#A33B3B;--dangerb:#FBEAEA;
  --font-display:"Noto Serif TC",serif;--font-body:"Noto Sans TC","PingFang TC",sans-serif;--font-ui:"Instrument Sans","Noto Sans TC",sans-serif;
  --radius:18px;--shadow:0 1px 2px rgba(15,22,18,.04),0 10px 28px rgba(15,22,18,.06);--side:280px;--nav-h:64px;
}
*{box-sizing:border-box}
body.has-site-chrome .app{min-height:calc(100vh - var(--nav-h))}
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:calc(100vh - var(--nav-h));flex:1}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:sticky;top:0;z-index:5;max-height:44vh;overflow:auto;border-right:none;border-bottom:1px solid rgba(255,255,255,.06)}
}
.sidebar{
  background:linear-gradient(165deg, rgba(92,138,114,.18) 0%, transparent 42%),linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
  color:#E4EBE6;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.05);box-shadow:8px 0 32px rgba(15,22,18,.12);
}
.side-head{padding:28px 22px 18px;border-bottom:1px solid rgba(255,255,255,.07);position:relative}
.side-head::after{content:"";position:absolute;left:22px;right:22px;bottom:0;height:2px;background:linear-gradient(90deg, var(--accent), rgba(196,138,90,.7), transparent);border-radius:2px}
.side-eyebrow{font-family:var(--font-ui);font-size:.62rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(196,210,200,.55);margin-bottom:10px}
.side-head h1{font-family:var(--font-display);font-size:1.28rem;color:#F7FBF8;font-weight:600;margin:0;line-height:1.35}
.side-head p{font-size:.74rem;color:rgba(228,235,230,.5);margin:10px 0 0;line-height:1.55;font-weight:300}
.side-tools{padding:14px 14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid rgba(255,255,255,.06)}
.side-tools input{width:100%;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:11px 14px;font:inherit;font-size:.84rem;background:rgba(255,255,255,.05);color:#F2F7F4}
.side-tools input::placeholder{color:rgba(255,255,255,.35)}
.side-tools input:focus{outline:none;border-color:rgba(92,138,114,.7);background:rgba(255,255,255,.08);box-shadow:0 0 0 3px var(--accent-glow)}
.side-tools .btn-primary{width:100%;justify-content:center;border-radius:12px;padding:11px 14px}
.job-list{flex:1;overflow:auto;padding:10px 8px 20px}
.job-item{width:100%;text-align:left;border:none;border-left:3px solid transparent;background:transparent;border-radius:0 14px 14px 0;padding:12px 12px;cursor:pointer;font:inherit;margin-bottom:3px;color:rgba(228,235,230,.7);transition:background .15s,border-color .15s,color .15s}
.job-item:hover{background:rgba(255,255,255,.05);color:#fff}
.job-item.active{background:rgba(92,138,114,.2);border-left-color:var(--accent);color:#fff}
.job-item.needs-pm{border-left-color:var(--warn)}
.job-item.active.needs-pm{border-left-color:#F0C9A0}
.job-item .name{font-family:var(--font-display);font-weight:500;font-size:.9rem;display:block;line-height:1.4}
.job-item .meta{font-family:var(--font-ui);font-size:.68rem;color:rgba(228,235,230,.38);margin-top:6px;letter-spacing:.03em;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.job-item.active .meta{color:rgba(228,235,230,.58)}
.job-chip{display:inline-block;font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08);color:rgba(228,235,230,.7)}
.job-chip.warn{background:rgba(154,107,47,.35);color:#F0C9A0}
.job-chip.ok{background:rgba(47,122,85,.35);color:#B8E0C8}
.job-chip.idle{background:rgba(92,138,114,.25);color:#C8DCCF}
.job-list .hint{color:rgba(228,235,230,.4)!important;padding:12px;font-size:.82rem}
.side-mini{padding:10px 16px 16px;font-size:.68rem;color:rgba(228,235,230,.4);border-top:1px solid rgba(255,255,255,.06)}

.main{display:flex;flex-direction:column;min-width:0;min-height:calc(100vh - var(--nav-h));background:transparent}
.topbar{background:rgba(250,247,241,.55);backdrop-filter:blur(12px);border-bottom:1px solid rgba(221,213,200,.65);padding:14px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.view-tabs{display:flex;gap:24px;flex-wrap:wrap;margin-right:auto}
.view-tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:6px 2px 10px;font:inherit;font-family:var(--font-ui);font-size:.9rem;font-weight:600;color:var(--mute);cursor:pointer}
.view-tab:hover{color:var(--ink)}
.view-tab.active{color:var(--ink);border-bottom-color:var(--accent-d)}
.crumb{font-size:.88rem;color:var(--mute);min-width:120px}
.crumb strong{color:var(--ink)}
.content{padding:18px 24px 40px;flex:1}
.empty{padding:48px 24px;text-align:center;color:var(--mute)}
.empty .hint-lg{font-family:var(--font-display);font-size:1.15rem;color:var(--ink);margin-bottom:10px;line-height:1.5}
.header-card{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px;position:relative;overflow:hidden}
.header-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.header-card.needs-pm::before{background:var(--warn)}
.header-card.is-resumed::before{background:var(--ok)}
.header-card .row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;position:relative}
.header-eyebrow{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:6px}
.header-card h2{font-family:var(--font-display);font-size:1.35rem;margin:0 0 8px;color:var(--ink);font-weight:600}
.header-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.header-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--cream-2);color:var(--mute)}
.chip code{font-size:.72rem;background:transparent;padding:0}
.badge{display:inline-block;font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:999px}
.badge.b-active{background:var(--infob);color:var(--info)}
.badge.b-warn{background:var(--warnb);color:var(--warn)}
.badge.b-ok{background:var(--okb);color:var(--ok)}
.section{background:var(--paper);border:1px solid var(--line-soft);border-radius:16px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.section-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none}
.section-title{font-family:var(--font-display);font-size:1rem;margin:0;color:var(--ink);flex:1}
.section-body{padding:0 16px 16px;border-top:1px solid var(--line-soft)}
.section-collapsible:not(.is-open) .section-body{display:none}
.section-collapsible .sec-chevron{color:var(--mute);transition:transform .15s;display:inline-block;width:1em}
.section-collapsible.is-open .sec-chevron{transform:rotate(90deg);color:var(--accent)}
.sec-hint{font-size:.72rem;font-weight:600;color:var(--info);background:var(--infob);padding:2px 8px;border-radius:999px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:12px}
@media(max-width:720px){.detail-grid{grid-template-columns:1fr}}
.detail-grid dt{font-size:.65rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:700}
.detail-grid dd{margin:2px 0 0;font-size:.88rem;line-height:1.45;white-space:pre-wrap}
.ext-item{font-size:.8rem;color:var(--mute);padding:8px 10px;border-radius:10px;background:var(--cream-2);margin-bottom:6px}
.ext-item strong{color:var(--ink)}
.history-body{font-size:.8rem;line-height:1.5;color:var(--text);white-space:pre-wrap;padding-top:10px}
.po-badge{display:inline-block;min-width:1.4em;text-align:center;font-weight:700;font-size:.75rem;padding:1px 6px;border-radius:6px;background:var(--cream-2);color:var(--mute)}
.po-badge.p{background:var(--okb);color:var(--ok)}
.po-badge.o{background:var(--warnb);color:var(--warn)}
.remark-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.remark-row{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:start;background:var(--cream-2);border:1px solid var(--line-soft);border-radius:12px;padding:8px}
@media(max-width:560px){.remark-row{grid-template-columns:1fr auto}}
.remark-row input[type="date"],.remark-row input[type="text"],.remark-row textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:.85rem;background:#fff}
.remark-row textarea{min-height:40px;resize:vertical}
.remark-row .btn-icon{border:0;background:transparent;color:var(--mute);cursor:pointer;padding:6px 8px;border-radius:8px;font-size:1rem;line-height:1}
.remark-row .btn-icon:hover{background:var(--dangerb);color:var(--danger)}
.remark-add{margin-top:10px}
.alert-banner{background:var(--warnb);border:1px solid #E6D2B0;border-left:4px solid var(--warn);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.alert-banner h3{margin:0 0 6px;font-family:var(--font-display);font-size:1rem;color:var(--warn)}
.alert-banner p{margin:0 0 10px;font-size:.85rem;color:var(--text);line-height:1.45}
.alert-list{display:grid;gap:8px}
.alert-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:rgba(255,255,255,.55);border-radius:10px;padding:8px 10px}
.alert-row .info{font-size:.82rem;color:var(--ink);flex:1;min-width:180px}
.kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media(max-width:900px){.kpi-row{grid-template-columns:1fr 1fr}}
.kpi{background:var(--paper);border:1px solid var(--line-soft);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.kpi .lab{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:700}
.kpi .num{font-family:var(--font-display);font-size:1.7rem;font-weight:600;color:var(--ink);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .delta{font-size:.78rem;color:var(--mute);margin-top:6px}
.kpi.accent{background:#1A3A2B;border-color:#1A3A2B;color:#FAF9F6}
.kpi.accent .lab,.kpi.accent .delta{color:rgba(250,249,246,.7)}
.kpi.accent .num{color:#FAF9F6}
.kpi.warn{background:var(--warnb);border-color:#E6D2B0}
.kpi.warn .num{color:var(--warn)}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:900px){.chart-row{grid-template-columns:1fr}}
.chart-card{background:var(--paper);border:1px solid var(--line-soft);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.chart-card h3{font-family:var(--font-display);font-size:1rem;margin:0 0 4px;color:var(--ink)}
.chart-card .sub{font-size:.75rem;color:var(--mute);margin-bottom:8px}
.chart-wrap{height:220px;position:relative}
.stats-shell{max-width:1100px}
.btn{border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;font-family:var(--font-ui);display:inline-flex;align-items:center;gap:4px}
.btn-sm{padding:6px 10px;font-size:.78rem}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{background:rgba(92,138,114,.1)}
.btn-primary{background:var(--accent-d);color:#fff}
.btn-primary:hover{filter:brightness(1.05)}
.btn-warn{background:var(--warn);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-ok{background:var(--ok);color:#fff}
.foot-bar{padding:10px 20px;border-top:1px solid var(--line-soft);font-size:.75rem;color:var(--mute);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;background:rgba(250,247,241,.4)}
.sync-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:8px;vertical-align:middle;animation:pulse 2s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.modal-bg{position:fixed;inset:0;background:rgba(15,22,18,.45);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--paper);border-radius:18px;max-width:680px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow);border:1px solid var(--line-soft)}
.form-section{margin:0 0 14px;padding:12px 12px 4px;border:1px solid var(--line-soft);border-radius:12px;background:rgba(250,247,241,.55)}
.form-section h3{margin:0 0 10px;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-d);font-family:var(--font-ui)}
.form-section .hint{font-size:.72rem;color:var(--mute);font-weight:500;text-transform:none;letter-spacing:0;margin-left:6px}
.form-section.fill{background:var(--infob);border-color:#C9DCE8}
.form-section.fill h3{color:var(--info)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line-soft)}
.modal-h h2{margin:0;font-family:var(--font-display);font-size:1.15rem}
.modal-x{border:0;background:transparent;font-size:1.2rem;cursor:pointer;color:var(--mute);padding:4px 8px}
.modal-b{padding:16px 18px}
.modal-f{padding:12px 18px 16px;border-top:1px solid var(--line-soft);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.span2{grid-column:span 2}
@media(max-width:560px){.grid{grid-template-columns:1fr}.span2{grid-column:span 1}}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.75rem;font-weight:600;color:var(--mute)}
.req{color:var(--accent)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:.88rem;background:#fff}
.field textarea{min-height:72px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(92,138,114,.14)}
.warn-note{font-size:.78rem;color:var(--warn);background:var(--warnb);padding:8px 10px;border-radius:8px;margin-top:4px}
.mail-preview{background:var(--cream-2);border-radius:12px;padding:12px 14px;font-size:.85rem;line-height:1.5}
.mail-preview .row{margin-bottom:8px}
.mail-preview .lab{font-size:.68rem;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.mail-preview .body{white-space:pre-wrap;background:var(--paper);border-radius:8px;padding:10px;margin-top:4px;border:1px solid var(--line-soft)}
.toast{position:fixed;bottom:28px;right:28px;background:var(--ink);color:#F2F7F4;padding:13px 18px;border-radius:14px;font-size:.85rem;opacity:0;transition:opacity .2s;z-index:80;pointer-events:none;max-width:min(360px,90vw)}
.toast.show{opacity:1}
.toast.err{background:#7A2A2A}

.flow-banner{background:linear-gradient(135deg, rgba(232,241,246,.9), rgba(230,244,236,.55));border:1px solid #C9DCE8;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:.8rem;line-height:1.55;color:var(--text)}
.flow-banner strong{color:var(--info)}
.flow-steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.flow-step{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.7);color:var(--info);border:1px solid #C9DCE8}
.section-head.static{cursor:default}
.sec-hint.warn{background:var(--warnb);color:var(--warn)}
.sec-hint.ok{background:var(--okb);color:var(--ok)}
.inline-form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:12px}
@media(max-width:720px){.inline-form{grid-template-columns:1fr}}
.inline-form .span2{grid-column:span 2}
@media(max-width:720px){.inline-form .span2{grid-column:span 1}}
.muted-note{font-size:.76rem;color:var(--mute);margin-top:8px;line-height:1.45}
.pdf-box{margin-top:12px;padding:12px;border:1px dashed var(--line);border-radius:12px;background:rgba(250,247,241,.7)}
.pdf-box.has-file{border-style:solid;border-color:#C9DCE8;background:var(--infob)}
.pdf-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pdf-name{font-size:.85rem;font-weight:600;color:var(--ink);flex:1;min-width:140px}
.upload-status{font-size:.75rem;color:var(--mute);margin-top:8px}
.upload-status.busy{color:var(--info)}
.upload-status.ok{color:var(--ok)}
.upload-status.err{color:var(--danger)}
.upload-status.warn{color:var(--warn)}
.ext-timeline{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.ext-card{border:1px solid var(--line-soft);border-radius:12px;padding:12px;background:var(--cream-2)}
.ext-card .ext-idx{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-d);margin-bottom:6px}
.ext-card .ext-meta{font-size:.82rem;color:var(--text);line-height:1.45}
.ext-card .ext-note{font-size:.78rem;color:var(--mute);margin-top:6px;white-space:pre-wrap}
.ext-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ext-empty{font-size:.85rem;color:var(--mute);padding:8px 0}
.complete-box{margin-top:12px;padding:12px;border-radius:12px;background:var(--okb);border:1px solid #B8DCC8}
.complete-box.pending{background:var(--cream-2);border-color:var(--line-soft)}
.section-title-plain{font-family:var(--font-display);font-size:1.05rem;margin:8px 0 12px;color:var(--ink)}
</style>
</head>

<body class="site-body has-site-chrome">

    <span class="site-brand-mark" aria-hidden="true"></span>

    </span>
  </a>

  </ul>

<div class="app">
  <aside class="sidebar">
    <div class="side-head">
      <div class="side-eyebrow">FSD · CFSO</div>
      <h1>FSI 暫停管理</h1>
      <p>一單工程一紀錄 · 關閉通知書／延期／完結</p>
    </div>
    <div class="side-tools">
      <input type="search" id="sideSearch" placeholder="搜尋位置 / 檔案編號 / PM…" autocomplete="off">
      <button type="button" class="btn btn-primary" id="btnNewCase">＋ 新工程</button>
    </div>
    <div class="job-list" id="jobList"></div>
    <div class="side-mini" id="sideMeta"></div>
  </aside>
  <section class="main">
    <div class="topbar">
      <div class="view-tabs" id="viewTabs">
        <button type="button" class="view-tab active" data-view="cases">項目記錄</button>
        <button type="button" class="view-tab" data-view="stats">統計總結</button>
      </div>
      <div class="crumb" id="crumb"><strong>FSI</strong> · 載入中…</div>
    </div>
    <div class="content" id="content"></div>
    <div class="foot-bar">
      <span><span class="sync-dot" id="syncDot"></span><span id="syncText">自動同步中</span></span>
      <span id="footMeta"></span>
    </div>
  </section>
</div>

<div class="modal-bg" id="modalBg" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-h"><h2 id="modalTitle">—</h2><button type="button" class="modal-x" id="modalClose" aria-label="關閉">×</button></div>
    <div class="modal-b" id="modalBody"></div>
    <div class="modal-f" id="modalFoot"></div>
  </div>

<script>
(function(){
const KEY='ts8_project_link_manager_v6';
const CFG=(typeof window!=='undefined'&&window.TS8_CONFIG)||{};
const UPLOAD_WEBAPP_URL=CFG.UPLOAD_WEBAPP_URL||'';
const UPLOAD_SECRET=CFG.UPLOAD_SECRET||'';
const DRIVE_FOLDER_ID=CFG.DRIVE_FOLDER_ID||'';
const SYNC_URL=UPLOAD_WEBAPP_URL;
const SEED_URL='./data/fsi-suspension-20251219.json?v=1';
const MAX_DAYS=14;
const OPEN_SECTIONS_KEY='fsi_open_sections_v2';

let db={projects:[], meta:{}, fsi:{cases:[], meta:{}}};
let mainView=(location.hash==='#stats')?'stats':'cases';
let selectedCaseId=null;
let sideQ='';
let openSectionIds=loadOpenSet(OPEN_SECTIONS_KEY);
let deptChart=null, fsiChart=null, statusChart=null;
let _pushTimer=null, _pullBusy=false, _pushBusy=false, _lastCloudUpdatedAt='';
let _seedDone=false;
let modalState=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function uid(p){ return (p||'id')+'-'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseDate(s){
  if(!s) return null;
  const m=String(s).slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return null;
  return new Date(+m[1], +m[2]-1, +m[3]);
}
function addDays(iso, n){
  const d=parseDate(iso);
  if(!d) return '';
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function daysBetween(a,b){
  const da=parseDate(a), db_=parseDate(b);
  if(!da||!db_) return null;
  return Math.round((db_-da)/86400000);
}
function clientMeta(){
  try{
    var k='ts8_cid';
    var cid=localStorage.getItem(k);
    if(!cid){ cid='c'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem(k,cid); }
    return { cid:cid, ua:(navigator.userAgent||'').slice(0,180), page:location.pathname+location.search };
  }catch(e){ return { cid:'', ua:'', page:'' }; }
}
function toast(msg, err){
  const el=$('toast'); if(!el) return;
  el.textContent=msg; el.classList.toggle('err', !!err); el.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'), 2800);
}
function setSyncText(t){ const el=$('syncText'); if(el) el.textContent=t; }

function loadOpenSet(key){
  try{
    const raw=sessionStorage.getItem(key);
    if(!raw) return new Set();
    const arr=JSON.parse(raw);
    return new Set(Array.isArray(arr)?arr:[]);
  }catch(_){ return new Set(); }
}
function saveOpenSet(key, set){
  try{ sessionStorage.setItem(key, JSON.stringify([...set])); }catch(_){}
}

function migrateDb(raw){
  const data=JSON.parse(JSON.stringify(raw||{projects:[]}));
  if(!Array.isArray(data.projects)) data.projects=[];
  if(!data.fsi || typeof data.fsi!=='object') data.fsi={cases:[], meta:{}};
  if(!Array.isArray(data.fsi.cases)) data.fsi.cases=[];
  if(!data.fsi.meta || typeof data.fsi.meta!=='object') data.fsi.meta={};
  data.fsi.cases=data.fsi.cases.map(normalizeCase);
  if(!data.meta) data.meta={};
  return data;
}
function emptySpotCheck(){
  return { fe:'', detector:'', noticeOnSite:'', inspectedBy:'', inspectionDate:'' };
}
function emptyJoint(){
  return { attendees:'', date:'' };
}
function normalizeSpotCheck(s){
  s=s||{};
  return {
    fe:s.fe!=null?String(s.fe):(s.FE!=null?String(s.FE):''),
    detector:s.detector!=null?String(s.detector):'',
    noticeOnSite:s.noticeOnSite!=null?String(s.noticeOnSite):(s.notice!=null?String(s.notice):''),
    inspectedBy:s.inspectedBy!=null?String(s.inspectedBy):(s.by!=null?String(s.by):''),
    inspectionDate:s.inspectionDate!=null?String(s.inspectionDate):(s.date!=null?String(s.date):'')
  };
}
function normalizeJoint(j){
  j=j||{};
  return { attendees:j.attendees!=null?String(j.attendees):'', date:j.date!=null?String(j.date):'' };
}
function looksLikeImportedRemarks(s){
  s=String(s||'');
  if(!s.trim()) return false;
  if(s.length>=120) return true;
  return /Extension form|Reminded|Received|completion form|resumed on|Will consider|requested|standalone detector/i.test(s);
}
function normalizeRemarkItem(r){
  r=r||{};
  return {
    id:r.id||uid('rm'),
    text:r.text!=null?String(r.text):(r.note!=null?String(r.note):''),
    at:r.at!=null?String(r.at).slice(0,10):(r.date!=null?String(r.date).slice(0,10):'')
  };
}
function migrateRemarksList(c){
  let list=Array.isArray(c.remarksList)?c.remarksList.map(normalizeRemarkItem):[];
  let remarks=c.remarks||'';
  let historyLog=c.historyLog||'';
  if(!historyLog && looksLikeImportedRemarks(remarks)){
    historyLog=remarks;
    remarks='';
  }
  if(!list.length && remarks && String(remarks).trim()){
    const lines=String(remarks).split(/\n+/).map(s=>s.trim()).filter(Boolean);
    if(lines.length>1){
      list=lines.map(t=>normalizeRemarkItem({text:t, at:''}));
    } else {
      list=[normalizeRemarkItem({text:String(remarks).trim(), at:''})];
    }
  }
  const joined=list.map(x=>x.text).filter(Boolean).join('\n');
  return { remarksList:list, remarks:joined, historyLog };
}
function normalizeCase(c){
  c=c||{};
  const rm=migrateRemarksList(c);
  let spotCheck=normalizeSpotCheck(c.spotCheck||c.spot||emptySpotCheck());
  let jointInspection=normalizeJoint(c.jointInspection||c.joint||emptyJoint());
  // Prefer single remarks string for UX; keep remarksList in data for backward compat
  let remarks=rm.remarks||'';
  if(!remarks && (rm.remarksList||[]).length){
    remarks=(rm.remarksList||[]).map(x=>x&&x.text?String(x.text):'').filter(Boolean).join('\n');
  }
  return {
    id:c.id||uid('fsi'),
    dept:c.dept||'',
    location:c.location||'',
    pm:c.pm||'',
    pmEmail:c.pmEmail||'',
    ref:c.ref||'',
    contractor:c.contractor||'',
    fsi:Array.isArray(c.fsi)?c.fsi.slice():[],
    noticeDate:c.noticeDate||'',
    periodStart:c.periodStart||c.noticeDate||'',
    plannedResume:c.plannedResume||'',
    noticePdf:normalizePdf(c.noticePdf||c.suspensionPdf||null),
    status:(c.status==='resumed')?'resumed':'active',
    completedAt:c.completedAt||'',
    completionNote:c.completionNote||'',
    spotCheck,
    jointInspection,
    remarks:remarks,
    remarksList:rm.remarksList,
    historyLog:rm.historyLog,
    extensions:Array.isArray(c.extensions)?c.extensions.map(normalizeExt):[],
    updatedAt:c.updatedAt||new Date().toISOString(),
    reminderSentAt:c.reminderSentAt||''
  };
}
function normalizePdf(p){
  if(!p) return null;
  if(typeof p==='string'){
    const s=p.trim(); if(!s) return null;
    return { url:s, driveFileId:'', name:s.split('/').pop()||'PDF' };
  }
  const url=p.url||p.webViewLink||'';
  const driveFileId=p.driveFileId||p.id||p.fileId||'';
  const name=p.name||p.filename||'';
  if(!url && !driveFileId) return null;
  return { url:url||(driveFileId?('https://drive.google.com/file/d/'+driveFileId+'/view'):''), driveFileId, name:name||'PDF' };
}
function normalizeExt(e){
  e=e||{};
  return {
    id:e.id||uid('ext'),
    receivedAt:e.receivedAt||e.received||'',
    noticeDate:e.noticeDate||'',
    periodStart:e.periodStart||e.noticeDate||'',
    plannedResume:e.plannedResume||e.planned_resume||'',
    pdf:normalizePdf(e.pdf||e.noticePdf||null),
    note:e.note!=null?String(e.note):(e.remarks!=null?String(e.remarks):''),
    createdAt:e.createdAt||new Date().toISOString()
  };
}
function syncRemarksString(c){
  c.remarks=(c.remarksList||[]).map(x=>x.text).filter(Boolean).join('\n');
}

function effectiveWindow(c){
  const exts=c.extensions||[];
  if(exts.length){
    const last=exts[exts.length-1];
    return {
      start:last.periodStart||last.noticeDate||c.periodStart||c.noticeDate||'',
      resume:last.plannedResume||c.plannedResume||'',
      source:'extension',
      ext:last
    };
  }
  return { start:c.periodStart||c.noticeDate||'', resume:c.plannedResume||'', source:'initial', ext:null };
}
function effectivePeriodStart(c){ return effectiveWindow(c).start; }
function needsPmUpdate(c){
  if(!c || c.status==='resumed') return false;
  const start=effectivePeriodStart(c);
  const d=parseDate(start);
  if(!d) return false;
  const limit=new Date(d.getFullYear(), d.getMonth(), d.getDate());
  limit.setDate(limit.getDate()+MAX_DAYS);
  const today=new Date();
  const t0=new Date(today.getFullYear(), today.getMonth(), today.getDate());
  return t0>limit;
}

function cases(){ return (db.fsi&&db.fsi.cases)||[]; }
function findCase(id){ return cases().find(c=>c.id===id)||null; }
function selectedCase(){ return selectedCaseId?findCase(selectedCaseId):null; }

function mapSeedCase(raw, i){
  const historyLog=raw.remarks||'';
  const resumed=/resumed|completion form|已恢復/i.test(historyLog);
  const commence=raw.commence||'';
  const planned=raw.planned_resume||'';
  const exts=(raw.extensions||[]).map((e)=>{
    let periodStart='', plannedResume=e.planned_resume||'';
    const extStr=e.extended||'';
    const m=String(extStr).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s*to\s*(\d{1,2})\/(\d{1,2})\/(\d{4})/i);
    if(m){
      periodStart=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
      if(!plannedResume) plannedResume=m[6]+'-'+m[5].padStart(2,'0')+'-'+m[4].padStart(2,'0');
    }
    if(!periodStart && plannedResume) periodStart=addDays(plannedResume, -MAX_DAYS);
    const note=e.remarks||extStr||'';
    const receivedM=String(note).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    let receivedAt='';
    if(receivedM) receivedAt=receivedM[3]+'-'+receivedM[2].padStart(2,'0')+'-'+receivedM[1].padStart(2,'0');
    return normalizeExt({
      id:uid('ext'),
      receivedAt:receivedAt,
      noticeDate:periodStart,
      periodStart:periodStart,
      plannedResume:plannedResume,
      note:note,
      createdAt:new Date().toISOString()
    });
  });
  return normalizeCase({
    id:uid('fsi'),
    dept:raw.dept||'',
    location:raw.location||'',
    pm:raw.pm||'',
    pmEmail:'',
    ref:raw.ref||('SEED-'+i),
    contractor:raw.contractor||'',
    fsi:raw.fsi||[],
    noticeDate:commence,
    periodStart:commence,
    plannedResume:planned,
    status:resumed?'resumed':'active',
    spotCheck:normalizeSpotCheck(raw.spot||{}),
    jointInspection:normalizeJoint(raw.joint||{}),
    remarks:'',
    remarksList:[],
    historyLog:historyLog,
    extensions:exts,
    updatedAt:new Date().toISOString()
  });
}

function loadLocal(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){ db=migrateDb(JSON.parse(raw)); return; }
  }catch(_){}
  db=migrateDb({projects:[], meta:{}, fsi:{cases:[], meta:{}}});
}
function saveLocalOnly(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(_){} }
function touchMeta(){
  db.meta=db.meta||{};
  db.meta.updatedAt=new Date().toISOString();
  db.meta.rev=(db.meta.rev|0)+1;
  db.fsi=db.fsi||{cases:[], meta:{}};
  db.fsi.meta=db.fsi.meta||{};
  db.fsi.meta.updatedAt=db.meta.updatedAt;
}
function save(){
  touchMeta();
  saveLocalOnly();
  setSyncText('自動同步中');
  if(!UPLOAD_WEBAPP_URL) return;
  clearTimeout(_pushTimer);
  _pushTimer=setTimeout(()=>{ pushShared(true); }, 800);
}

function parseUpdatedAt(iso){
  if(!iso) return 0;
  const n=Date.parse(iso);
  return Number.isFinite(n)?n:0;
}
function cloudIsNewer(shared, local){
  const s=parseUpdatedAt(shared&&shared.meta&&shared.meta.updatedAt);
  const l=parseUpdatedAt(local&&local.meta&&local.meta.updatedAt);
  if(s && l) return s>l;
  if(s && !l) return true;
  return false;
}
function applyCloudDb(shared){
  if(!shared||!Array.isArray(shared.projects)) return {changed:false};
  const before=JSON.stringify(db);
  db=migrateDb(shared);
  saveLocalOnly();
  const at=(db.meta&&db.meta.updatedAt)||'';
  if(at) _lastCloudUpdatedAt=at;
  if(selectedCaseId && !findCase(selectedCaseId)) selectedCaseId=null;
  return {changed: before!==JSON.stringify(db)};
}
async function fetchSharedDb(){
  if(!SYNC_URL) throw new Error('no sync url');
  const res=await fetch(SYNC_URL+'?op=db&t='+Date.now(),{cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data=await res.json();
  if(data && data.db && Array.isArray(data.db.projects)) return data.db;
  if(data && Array.isArray(data.projects)) return data;
  throw new Error('invalid sync payload');
}
async function pullShared(silent){
  if(_pullBusy) return null;
  _pullBusy=true;
  try{
    const shared=await fetchSharedDb();
    const cloudUpdated=(shared.meta&&shared.meta.updatedAt)||'';
    if(silent && cloudUpdated && cloudUpdated===_lastCloudUpdatedAt){
      return {shared, skipped:true};
    }
    if(!cloudIsNewer(shared, db) && cloudUpdated===((db.meta&&db.meta.updatedAt)||'')){
      if(cloudUpdated) _lastCloudUpdatedAt=cloudUpdated;
      return {shared, skipped:true};
    }
    if(!cloudIsNewer(shared, db) && parseUpdatedAt(db.meta&&db.meta.updatedAt) > parseUpdatedAt(cloudUpdated)){
      return {shared, localNewer:true};
    }
    const applied=applyCloudDb(shared);
    if(!silent || applied.changed) render();
    setSyncText('自動同步中');
    return {shared, reallyChanged:!!applied.changed};
  }catch(err){
    if(!silent) toast('同步暫時失敗', true);
    console.warn(err);
    setSyncText('自動同步中（離線）');
    return null;
  }finally{ _pullBusy=false; }
}
async function pushShared(silent){
  if(!SYNC_URL) return false;
  if(_pushBusy) return false;
  _pushBusy=true;
  try{
    try{
      const cloud=await fetchSharedDb();
      if(cloudIsNewer(cloud, db)){
        applyCloudDb(cloud);
        render();
        if(!silent) toast('已同步較新版本');
        return false;
      }
    }catch(_){}
    db.meta=db.meta||{};
    db.meta.updatedAt=new Date().toISOString();
    db.meta.rev=(db.meta.rev|0)+1;
    saveLocalOnly();
    const res=await fetch(SYNC_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(Object.assign({ secret:UPLOAD_SECRET, op:'saveDb', db, baseUpdatedAt:_lastCloudUpdatedAt||'', note:'fsi-saveDb' }, clientMeta()))
    });
    const text=await res.text();
    let data=null;
    try{ data=JSON.parse(text); }catch(_){}
    if(data && data.ok===false && data.error==='stale' && data.current){
      applyCloudDb(data.current);
      render();
      if(!silent) toast('已同步較新版本');
      return false;
    }
    if(!res.ok || (data && data.ok===false)){
      throw new Error((data&&(data.error||data.message))||('HTTP '+res.status));
    }
    _lastCloudUpdatedAt=(db.meta&&db.meta.updatedAt)||_lastCloudUpdatedAt;
    setSyncText('自動同步中');
    return true;
  }catch(err){
    console.warn(err);
    if(!silent) toast('同步暫時失敗', true);
    setSyncText('自動同步中（稍後重試）');
    return false;
  }finally{ _pushBusy=false; }
}

async function ensureSeeded(){
  if(_seedDone) return;
  if(cases().length>0){ _seedDone=true; return; }
  try{
    const res=await fetch(SEED_URL,{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const payload=await res.json();
    const mapped=(payload.cases||[]).map(mapSeedCase);
    db.fsi=db.fsi||{cases:[], meta:{}};
    db.fsi.cases=mapped;
    db.fsi.meta={
      seededFrom:payload.sourceFile||SEED_URL,
      snapshotDate:payload.snapshotDate||'',
      seededAt:new Date().toISOString(),
      note:'Seeded once from GitHub snapshot; SharePoint Excel never modified.'
    };
    touchMeta();
    saveLocalOnly();
    await pushShared(true);
    _seedDone=true;
    toast('已載入種子資料（'+mapped.length+' 宗）');
  }catch(err){
    console.warn('seed failed', err);
    toast('種子資料載入失敗', true);
  }
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>{ const s=String(r.result||''); const i=s.indexOf(','); resolve(i>=0?s.slice(i+1):s); };
    r.onerror=()=>reject(r.error||new Error('讀取失敗'));
    r.readAsDataURL(file);
  });
}
async function uploadPdfToDrive(file){
  if(!UPLOAD_WEBAPP_URL) throw new Error('上傳端點尚未設定');
  const base64=await fileToBase64(file);
  const res=await fetch(UPLOAD_WEBAPP_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({
      secret:UPLOAD_SECRET,
      filename:file.name,
      mimeType:file.type||'application/pdf',
      base64,
      folderId:DRIVE_FOLDER_ID
    }, clientMeta()))
  });
  const text=await res.text();
  let data;
  try{ data=JSON.parse(text); }catch{ throw new Error('伺服器回應無效'); }
  if(!res.ok || !data || !data.ok) throw new Error((data&&(data.error||data.message))||('上傳失敗'));
  const id=data.id||data.fileId||'';
  const url=data.url||data.webViewLink||(id?('https://drive.google.com/file/d/'+id+'/view'):'');
  if(!url) throw new Error('回應缺少檔案連結');
  return { driveFileId:id, url, name:data.name||file.name };
}
function pdfLinkHtml(pdf){
  if(!pdf||!pdf.url) return '<span style="color:var(--mute)">尚未上載 PDF</span>';
  return `<a href="${esc(pdf.url)}" target="_blank" rel="noopener">${esc(pdf.name||'開啟 PDF')}</a>`;
}
function windowWarnHtml(start, resume){
  const d=daysBetween(start, resume);
  if(d===null) return '';
  if(d>MAX_DAYS) return `<div class="warn-note">計劃恢復距離本期開始為 ${d} 日，超過建議 ${MAX_DAYS} 日窗口。請盡量縮短，或以 Extension Form 分期管理。</div>`;
  return '';
}

function summarize(list){
  const byDept={}, byFsi={}; let active=0, resumed=0, alert=0, ext=0;
  list.forEach(c=>{
    byDept[c.dept||'（無）']=(byDept[c.dept||'（無）']||0)+1;
    (c.fsi||[]).forEach(f=>{ byFsi[f]=(byFsi[f]||0)+1; });
    ext += (c.extensions||[]).length;
    if(c.status==='resumed') resumed++; else active++;
    if(needsPmUpdate(c)) alert++;
  });
  return {total:list.length, active, resumed, alert, ext, byDept, byFsi};
}

function filteredJobs(){
  const q=(sideQ||'').trim().toLowerCase();
  const list=cases().slice().sort((a,b)=>{
    const aa=needsPmUpdate(a)?0:1, bb=needsPmUpdate(b)?0:1;
    if(aa!==bb) return aa-bb;
    if((a.status==='resumed')!==(b.status==='resumed')) return a.status==='resumed'?1:-1;
    return String(a.location||'').localeCompare(String(b.location||''),'zh-Hant');
  });
  if(!q) return list;
  return list.filter(c=>{
    const sc=c.spotCheck||{}, ji=c.jointInspection||{};
    const hay=[c.location,c.dept,c.ref,c.pm,c.pmEmail,c.contractor,c.remarks,c.historyLog,
      sc.fe,sc.detector,sc.noticeOnSite,sc.inspectedBy,sc.inspectionDate,
      ji.attendees,ji.date,(c.fsi||[]).join(' ')].join(' ').toLowerCase();
    return hay.includes(q);
  });
}

function statusBadge(c){
  if(c.status==='resumed') return '<span class="badge b-ok">完結</span>';
  if(needsPmUpdate(c)) return '<span class="badge b-warn">需延期／更新</span>';
  return '<span class="badge b-active">進行中</span>';
}
function jobChip(c){
  if(c.status==='resumed') return '<span class="job-chip ok">完結</span>';
  if(needsPmUpdate(c)) return '<span class="job-chip warn">需提醒</span>';
  return '<span class="job-chip idle">進行中</span>';
}
function poBadge(v){
  const t=String(v||'').trim().toUpperCase();
  if(!t) return '<span class="po-badge">—</span>';
  const cls=t==='P'?'p':(t==='O'?'o':'');
  return `<span class="po-badge ${cls}">${esc(t)}</span>`;
}

function renderSidebar(){
  const list=filteredJobs();
  const all=cases();
  const sum=summarize(all);
  const el=$('jobList');
  if(!list.length){
    el.innerHTML=`<div class="hint">${all.length?'沒有符合搜尋的工程':'尚未有工程 · 按上方新增'}</div>`;
  } else {
    el.innerHTML=list.map(c=>{

function sectionOpen(key, defaultOpen){
  if(openSectionIds.has(key)) return true;
  if(openSectionIds.has('!'+key)) return false;
  return !!defaultOpen;
}
function collapsible(key, title, bodyHtml, opts){
  opts=opts||{};
  const open=sectionOpen(key, opts.defaultOpen);
  const hint=opts.hint?`<span class="sec-hint${opts.hintClass?' '+opts.hintClass:''}">${esc(opts.hint)}</span>`:'';
  return `<div class="section section-collapsible ${open?'is-open':''}" data-section="${esc(key)}">
    <div class="section-head" data-act="toggle-section" data-section="${esc(key)}">
      <span class="sec-chevron">▸</span>
      <div class="section-title">${title}</div>
      ${hint}
    </div>
    <div class="section-body">${bodyHtml}</div>
  </div>`;
}
function solidSection(title, bodyHtml, hint, hintClass){
  const h=hint?`<span class="sec-hint${hintClass?' '+hintClass:''}">${esc(hint)}</span>`:'';
  return `<div class="section">
    <div class="section-head static">
      <div class="section-title">${title}</div>${h}
    </div>
    <div class="section-body">${bodyHtml}</div>
  </div>`;
}

function bindNoticeForm(caseId){
  const c=findCase(caseId); if(!c) return;
  const form=$('noticeForm'); if(!form) return;
  const notice=form.querySelector('[data-nf="noticeDate"]');
  const period=form.querySelector('[data-nf="periodStart"]');
  const resume=form.querySelector('[data-nf="plannedResume"]');
  function refreshWarn(){
    const w=$('noticeWarn');
    if(w) w.innerHTML=windowWarnHtml(period.value||notice.value, resume.value);
  }
  if(notice) notice.addEventListener('change', ()=>{
    if(notice.value){
      if(period && !period.value) period.value=notice.value;
      if(resume && !resume.value) resume.value=addDays(notice.value, MAX_DAYS);
    }
    refreshWarn();
  });
  if(period) period.addEventListener('change', ()=>{
    if(period.value && resume && !resume.dataset.touched) resume.value=addDays(period.value, MAX_DAYS);
    refreshWarn();
  });
  if(resume) resume.addEventListener('change', ()=>{ resume.dataset.touched='1'; refreshWarn(); });
}

    statusChart=new Chart(el3,{type:'doughnut',data:{labels:['進行中','完結','需提醒 PM'],datasets:[{data:[sum.active, sum.resumed, sum.alert],backgroundColor:['#5C8A72','#2F7A55','#9A6B2F']}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:10}}}}});
  }
}

function syncViewTabs(){
  document.querySelectorAll('#viewTabs .view-tab').forEach(btn=>{
    btn.classList.toggle('active', btn.getAttribute('data-view')===mainView);
  });
}

function render(){
  syncViewTabs();
  destroyCharts();
  renderSidebar();
  if(mainView==='stats') renderStatsView();
  else renderCasesView();
  const at=(db.meta&&db.meta.updatedAt)||'';

  if(meta){
    if(at){
      try{ meta.textContent='上次更新 '+new Date(at).toLocaleString('zh-HK',{timeZone:'Asia/Hong_Kong'}); }
      catch{ meta.textContent=''; }
    } else meta.textContent='FSI · 共用同步';
  }
}

function selectCase(id){
  selectedCaseId=id||null;
  mainView='cases';
  if(location.hash==='#stats') history.replaceState(null,'',location.pathname+location.search+'#cases');
  else if(location.hash!=='#cases') location.hash='cases';
  render();
}

function bindMainActions(){
  document.querySelectorAll('#content [data-act]').forEach(el=>{
    el.addEventListener('click', async e=>{
      const act=el.getAttribute('data-act');
      const id=el.getAttribute('data-id');
      if(act==='toggle-section'){
        const key=el.getAttribute('data-section');
        const sec=document.querySelector('.section-collapsible[data-section="'+CSS.escape(key)+'"]');
        if(!sec) return;
        const open=!sec.classList.contains('is-open');
        sec.classList.toggle('is-open', open);
        if(open){ openSectionIds.add(key); openSectionIds.delete('!'+key); }
        else { openSectionIds.delete(key); openSectionIds.add('!'+key); }
        saveOpenSet(OPEN_SECTIONS_KEY, openSectionIds);
        return;
      }
      e.preventDefault(); e.stopPropagation();
      if(act==='select'){ selectCase(id); return; }
      if(act==='edit') openCaseModal(id);
      else if(act==='extend') openExtendModal(id, null);
      else if(act==='ext-edit') openExtendModal(id, el.getAttribute('data-eid'));
      else if(act==='ext-del'){
        const c=findCase(id); if(!c) return;
        const eid=el.getAttribute('data-eid');
        if(!confirm('刪除此 Extension Form？')) return;
        c.extensions=(c.extensions||[]).filter(x=>x.id!==eid);
        const last=(c.extensions||[])[(c.extensions||[]).length-1];
        if(last){
          c.periodStart=last.periodStart||c.periodStart;
          c.plannedResume=last.plannedResume||c.plannedResume;
          c.noticeDate=last.noticeDate||c.noticeDate;
        }
        c.updatedAt=new Date().toISOString();
        save(); render(); toast('已刪除 Extension');
      }
      else if(act==='resume') markResumed(id);
      else if(act==='reopen'){
        const c=findCase(id); if(!c) return;
        c.status='active';
        c.completedAt='';
        c.updatedAt=new Date().toISOString();
        save(); render(); toast('已重新開啟');
      }
      else if(act==='delete') deleteCase(id);
      else if(act==='remind') openRemindModal(id);
      else if(act==='save-notice'){
        const c=findCase(id); if(!c) return;
        const form=$('noticeForm'); if(!form) return;
        const noticeDate=(form.querySelector('[data-nf="noticeDate"]')||{}).value||'';
        const periodStart=(form.querySelector('[data-nf="periodStart"]')||{}).value||noticeDate;
        const plannedResume=(form.querySelector('[data-nf="plannedResume"]')||{}).value||'';
        const ref=(form.querySelector('[data-nf="ref"]')||{}).value||'';
        const d=daysBetween(periodStart, plannedResume);
        if(d!==null && d>MAX_DAYS && !confirm(`計劃恢復超過 ${MAX_DAYS} 日（${d} 日）。仍要儲存？`)) return;
        c.noticeDate=noticeDate;
        c.periodStart=periodStart;
        c.plannedResume=plannedResume||(periodStart?addDays(periodStart, MAX_DAYS):'');
        c.ref=String(ref).trim();
        c.updatedAt=new Date().toISOString();
        save(); render(); toast('已儲存關閉通知');
      }
      else if(act==='upload-notice-pdf'){
        const input=$('noticePdfInput');
        if(!input) return;
        input.onchange=()=>{
          const f=input.files&&input.files[0];
          input.value='';
          if(f) handleNoticePdfUpload(id, f);
        };
        input.click();
      }
      else if(act==='clear-notice-pdf'){
        const c=findCase(id); if(!c) return;
        if(!confirm('清除已連結的關閉通知書 PDF？')) return;
        c.noticePdf=null;
        c.updatedAt=new Date().toISOString();
        save(); render(); toast('已清除 PDF');
      }
      else if(act==='save-remarks'){
        const c=findCase(id); if(!c) return;
        const ta=$('workRemarks');
        c.remarks=ta?ta.value:'';
        c.updatedAt=new Date().toISOString();
        save(); renderSidebar(); toast('已儲存備註');
      }
      else if(act==='save-patrol'){
        const c=findCase(id); if(!c) return;
        const form=$('patrolForm'); if(!form) return;
        const g=k=>(form.querySelector('[data-pf="'+k+'"]')||{}).value||'';
        c.spotCheck=normalizeSpotCheck({
          fe:g('fe'), detector:g('detector'), noticeOnSite:g('noticeOnSite'),
          inspectedBy:String(g('inspectedBy')||'').trim(), inspectionDate:g('inspectionDate')
        });
        c.jointInspection=normalizeJoint({ attendees:String(g('jiAttendees')||'').trim(), date:g('jiDate') });
        c.updatedAt=new Date().toISOString();
        save(); render(); toast('已儲存巡查');
      }
    });
  });
}

async function handleNoticePdfUpload(caseId, file){
  const c=findCase(caseId); if(!c||!file) return;
  const st=$('noticePdfStatus');
  function setSt(msg, cls){ if(st){ st.className='upload-status'+(cls?' '+cls:''); st.textContent=msg; } }
  const n=(file.name||'').toLowerCase();
  if(!(file.type==='application/pdf' || n.endsWith('.pdf'))){ setSt('請選擇 PDF','err'); toast('請選擇 PDF', true); return; }
  if(!UPLOAD_WEBAPP_URL){ setSt('上傳端點尚未接上','warn'); toast('上傳端點尚未接上', true); return; }
  setSt('上傳中：'+file.name,'busy');
  try{
    const result=await uploadPdfToDrive(file);
    c.noticePdf={ url:result.url, driveFileId:result.driveFileId, name:result.name };
    c.updatedAt=new Date().toISOString();
    save();
    setSt('已上載','ok');
    toast('關閉通知書 PDF 已上載');
    render();
  }catch(err){
    console.warn(err);
    setSt('錯誤：'+(err&&err.message?err.message:String(err)),'err');
    toast(err&&err.message?err.message:'上傳失敗', true);
  }
}

function openCaseModal(id){
  const c=id?findCase(id):null;
  modalState={kind:'case', id:id||null};
  const fsiStr=(c&&c.fsi||[]).join(', ');
  openModalShell(c?'編輯基本資料':'新工程', `
    <div class="form-section">
      <h3>基本資料</h3>
      <div class="grid">
        <div class="field span2"><label>位置 <span class="req">*</span></label><input id="m_location" value="${esc(c?c.location:'')}"></div>
        <div class="field"><label>部門</label><input id="m_dept" value="${esc(c?c.dept:'')}" placeholder="CDO / CFSO"></div>
        <div class="field"><label>FSD／暫停編號</label><input id="m_ref" value="${esc(c?c.ref:'')}" placeholder="取得檔案編號後填入"></div>
        <div class="field"><label>PM</label><input id="m_pm" value="${esc(c?c.pm:'')}"></div>
        <div class="field"><label>PM Email</label><input id="m_pmEmail" type="email" value="${esc(c?c.pmEmail:'')}" placeholder="待填 email"></div>
        <div class="field span2"><label>承辦商</label><input id="m_contractor" value="${esc(c?c.contractor:'')}"></div>
        <div class="field span2"><label>暫停 FSI（逗號分隔）</label><input id="m_fsi" value="${esc(fsiStr)}" placeholder="Sprinkler, Detector"></div>
        <div class="field"><label>狀態</label><select id="m_status"><option value="active" ${(c?c.status:'active')==='active'?'selected':''}>進行中</option><option value="resumed" ${c&&c.status==='resumed'?'selected':''}>完結</option></select></div>
      </div>
    </div>
    ${!c?`<div class="form-section">
      <h3>關閉通知（初始）</h3>
      <p style="font-size:.78rem;color:var(--mute);margin:0 0 10px">可稍後於工程頁補 PDF。計劃恢復預設 +${MAX_DAYS} 日。</p>
      <div class="grid">
        <div class="field"><label>通知書日期</label><input type="date" id="m_notice" value=""></div>
        <div class="field"><label>本期開始</label><input type="date" id="m_period" value=""></div>
        <div class="field"><label>計劃恢復</label><input type="date" id="m_resume" value=""></div>
      </div>
      <div class="warn-note" id="m_warn" style="display:none"></div>
    </div>`:''}
  `, `
    <button type="button" class="btn btn-ghost" id="m_cancel">取消</button>
    <button type="button" class="btn btn-primary" id="m_save">儲存</button>
  `);
  if(!c){
    const notice=$('m_notice'), resume=$('m_resume'), warn=$('m_warn');
    function checkWindow(){
      const n=notice.value, r=resume.value, p=$('m_period').value||n;
      if(n && !r){ resume.value=addDays(n, MAX_DAYS); }
      if(p && resume.value){
        const d=daysBetween(p, resume.value);
        if(d!==null && d>MAX_DAYS){
          warn.style.display='block';
          warn.textContent=`注意：計劃恢復距離本期開始為 ${d} 日，超過 ${MAX_DAYS} 日。`;
        } else { warn.style.display='none'; }
      } else warn.style.display='none';
    }
    notice.addEventListener('change', ()=>{
      if(notice.value){
        if(!$('m_period').value) $('m_period').value=notice.value;
        if(!resume.value) resume.value=addDays(notice.value, MAX_DAYS);
      }
      checkWindow();
    });
    resume.addEventListener('change', checkWindow);
    $('m_period').addEventListener('change', checkWindow);
  }
  $('m_cancel').onclick=closeModal;
  $('m_save').onclick=()=>{
    const location=$('m_location').value.trim();
    if(!location){ toast('請填位置', true); return; }
    const payload={
      location,
      dept:$('m_dept').value.trim(),
      ref:$('m_ref').value.trim(),
      pm:$('m_pm').value.trim(),
      pmEmail:$('m_pmEmail').value.trim(),
      contractor:$('m_contractor').value.trim(),
      fsi:$('m_fsi').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),
      status:$('m_status').value==='resumed'?'resumed':'active'
    };
    if(id){
      const cur=findCase(id);
      Object.assign(cur, payload, { updatedAt:new Date().toISOString() });
      selectedCaseId=id;
    } else {
      const notice=$('m_notice')?$('m_notice').value:'';
      const period=$('m_period')?($('m_period').value||notice):notice;
      const planned=$('m_resume')?$('m_resume').value:(period?addDays(period, MAX_DAYS):'');
      if(period && planned){
        const d=daysBetween(period, planned);
        if(d!==null && d>MAX_DAYS && !confirm(`計劃恢復超過 ${MAX_DAYS} 日（${d} 日）。仍要儲存？`)) return;
      }
      const neu=normalizeCase(Object.assign({
        id:uid('fsi'),
        extensions:[],
        historyLog:'',
        remarksList:[],
        remarks:'',
        noticePdf:null,
        noticeDate:notice,
        periodStart:period,
        plannedResume:planned||(period?addDays(period, MAX_DAYS):'')
      }, payload));
      db.fsi.cases.push(neu);
      selectedCaseId=neu.id;
      mainView='cases';
    }
    save(); closeModal(); render(); toast('已儲存');
  };
}

function openExtendModal(id, eid){
  const c=findCase(id); if(!c) return;
  const existing=eid?(c.extensions||[]).find(x=>x.id===eid):null;
  modalState={kind:'extend', id, eid:eid||null};
  const start=existing?(existing.periodStart||todayStr()):todayStr();
  const end=existing?(existing.plannedResume||addDays(start, MAX_DAYS)):addDays(start, MAX_DAYS);
  const received=existing?(existing.receivedAt||todayStr()):todayStr();
  const notice=existing?(existing.noticeDate||start):start;
  openModalShell(existing?'編輯 Extension Form':'新增 Extension Form', `
    <p style="font-size:.85rem;color:var(--mute);margin-bottom:12px">延期須於先前窗口屆滿前遞交新／更新關閉通知。此處記錄為 Extension Form；新窗口建議 ≤ ${MAX_DAYS} 日。</p>
    <div class="grid">
      <div class="field"><label>收件／記錄日期</label><input type="date" id="m_received" value="${esc(received)}"></div>
      <div class="field"><label>延期通知日期 <span class="req">*</span></label><input type="date" id="m_notice" value="${esc(notice)}"></div>
      <div class="field"><label>新本期開始</label><input type="date" id="m_period" value="${esc(start)}"></div>
      <div class="field"><label>新計劃恢復（≤${MAX_DAYS} 日）</label><input type="date" id="m_resume" value="${esc(end)}"></div>
      <div class="field span2"><label>短備註（可選）</label><textarea id="m_note" placeholder="表格編號／原因…">${esc(existing?existing.note:'')}</textarea></div>
    </div>
    <div class="warn-note" id="m_warn" style="display:none"></div>
    <div class="pdf-box ${existing&&existing.pdf&&existing.pdf.url?'has-file':''}" style="margin-top:12px">
      <div class="pdf-row">
        <div class="pdf-name" id="m_extPdfLabel">${existing&&existing.pdf&&existing.pdf.url?pdfLinkHtml(existing.pdf):'延期通知 PDF（可選）'}</div>
        <button type="button" class="btn btn-ghost btn-sm" id="m_extPdfPick">上載 PDF</button>
        <input type="file" id="m_extPdfFile" accept="application/pdf,.pdf" hidden>
      </div>
      <div class="upload-status" id="m_extPdfStatus">${UPLOAD_WEBAPP_URL?'可選 · 上載後寫入 extensions[].pdf':'上傳端點未設定'}</div>
    </div>
  `, `<button type="button" class="btn btn-ghost" id="m_cancel">取消</button><button type="button" class="btn btn-primary" id="m_save">${existing?'儲存':'新增 Extension'}</button>`);

  let pendingPdf=existing&&existing.pdf?Object.assign({}, existing.pdf):null;
  const noticeEl=$('m_notice'), period=$('m_period'), resume=$('m_resume'), warn=$('m_warn');
  function sync(){
    if(noticeEl.value && !period.value) period.value=noticeEl.value;
    if(period.value && !resume.dataset.touched) resume.value=addDays(period.value, MAX_DAYS);
    const d=daysBetween(period.value||noticeEl.value, resume.value);
    if(d!==null && d>MAX_DAYS){ warn.style.display='block'; warn.textContent=`延期窗口 ${d} 日，超過建議 ${MAX_DAYS} 日。`; }
    else warn.style.display='none';
  }
  noticeEl.onchange=sync; period.onchange=sync; resume.onchange=()=>{ resume.dataset.touched='1'; sync(); };
  sync();

  $('m_extPdfPick').onclick=()=>$('m_extPdfFile').click();
  $('m_extPdfFile').onchange=async ()=>{
    const file=$('m_extPdfFile').files&&$('m_extPdfFile').files[0];
    $('m_extPdfFile').value='';
    if(!file) return;
    const st=$('m_extPdfStatus');
    const n=(file.name||'').toLowerCase();
    if(!(file.type==='application/pdf'||n.endsWith('.pdf'))){ st.className='upload-status err'; st.textContent='請選擇 PDF'; return; }
    if(!UPLOAD_WEBAPP_URL){ st.className='upload-status warn'; st.textContent='上傳端點尚未接上'; return; }
    st.className='upload-status busy'; st.textContent='上傳中…';
    try{
      const result=await uploadPdfToDrive(file);
      pendingPdf={ url:result.url, driveFileId:result.driveFileId, name:result.name };
      $('m_extPdfLabel').innerHTML=pdfLinkHtml(pendingPdf);
      st.className='upload-status ok'; st.textContent='已上載（儲存後一併寫入）';
    }catch(err){
      st.className='upload-status err'; st.textContent=err&&err.message?err.message:'上傳失敗';
      toast(err&&err.message?err.message:'上傳失敗', true);
    }
  };

  $('m_cancel').onclick=closeModal;
  $('m_save').onclick=()=>{
    if(!noticeEl.value){ toast('請填延期通知日期', true); return; }
    const ps=period.value||noticeEl.value;
    const pr=resume.value||addDays(ps, MAX_DAYS);
    const d=daysBetween(ps, pr);
    if(d!==null && d>MAX_DAYS && !confirm(`超過 ${MAX_DAYS} 日，仍要儲存？`)) return;
    c.extensions=c.extensions||[];
    const payload={
      receivedAt:$('m_received').value||todayStr(),
      noticeDate:noticeEl.value,
      periodStart:ps,
      plannedResume:pr,
      note:$('m_note').value.trim(),
      pdf:pendingPdf
    };
    if(existing){
      Object.assign(existing, payload);
    } else {
      c.extensions.push(normalizeExt(payload));
    }
    c.noticeDate=noticeEl.value;
    c.periodStart=ps;
    c.plannedResume=pr;
    c.status='active';
    c.updatedAt=new Date().toISOString();
    save(); closeModal(); render(); toast(existing?'已更新 Extension':'已新增 Extension Form');
  };
}

function buildRemindDraft(c){
  const start=effectivePeriodStart(c);
  const due=start?addDays(start, MAX_DAYS):'—';
  const to=c.pmEmail||'';
  const toDisplay=c.pmEmail||`（待填 email）${c.pm?` · ${c.pm}`:''}`;
  const subject=`[FSI] 請更新關閉通知／Extension Form — ${c.location||c.ref||'工程'}`;
  const body=`您好${c.pm?' '+c.pm:''}，

以下消防裝置關閉工程已超過約 ${MAX_DAYS} 日窗口，請於屆滿前遞交延期通知（Extension Form），或確認已完結：

位置：${c.location||'—'}
FSD／暫停編號：${c.ref||'—'}
部門：${c.dept||'—'}
現行窗口開始：${start||'—'}
${MAX_DAYS} 日屆滿日：${due}
計劃恢復：${c.plannedResume||'—'}
暫停 FSI：${(c.fsi||[]).join(', ')||'—'}

請盡快更新，謝謝。

（此為管理工具草稿預覽 · 尚未實際寄出）`;
  return {to, toDisplay, subject, body};
}

    <button type="button" class="btn btn-ghost" id="m_cancel">關閉</button>

    c.updatedAt=new Date().toISOString();
    save(); closeModal(); render();
    toast('已模擬發送提醒（已記錄 reminderSentAt）');
    console.info('[FSI mock remind]', {id:c.id, pm:c.pm, pmEmail:c.pmEmail, reminderSentAt:c.reminderSentAt});

function markResumed(id){
  const c=findCase(id); if(!c) return;
  const completedAt=($('m_completedAt')&&$('m_completedAt').value)||todayStr();
  const note=($('m_completionNote')&&$('m_completionNote').value.trim())||'';
  if(!confirm('標記此工程為完結？請確認已通知 FSD 並保存完結紀錄。')) return;
  c.status='resumed';
  c.completedAt=completedAt;
  c.completionNote=note;
  c.updatedAt=new Date().toISOString();
  save(); render(); toast('已標記完結');
}
function deleteCase(id){
  const c=findCase(id); if(!c) return;
  if(!confirm('刪除此工程？')) return;
  db.fsi.cases=db.fsi.cases.filter(x=>x.id!==id);
  if(selectedCaseId===id) selectedCaseId=null;
  save(); render(); toast('已刪除');
}

document.querySelectorAll('#viewTabs .view-tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const v=btn.getAttribute('data-view');
    mainView=v==='stats'?'stats':'cases';
    if(mainView==='stats') location.hash='stats';
    else if(location.hash==='#stats' || location.hash==='#cases') history.replaceState(null,'',location.pathname+location.search+(mainView==='cases'?'#cases':''));
    else location.hash='cases';
    render();
  });
});
window.addEventListener('hashchange', ()=>{
  const next=(location.hash==='#stats')?'stats':'cases';
  if(next!==mainView){ mainView=next; render(); }
});
$('btnNewCase').onclick=()=>openCaseModal(null);
$('modalClose').onclick=closeModal;
$('modalBg').addEventListener('click', e=>{ if(e.target===$('modalBg')) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

const sideSearch=$('sideSearch');
if(sideSearch){
  let t=null;
  sideSearch.oninput=()=>{
    clearTimeout(t);
    t=setTimeout(()=>{
      sideQ=sideSearch.value;
      renderSidebar();
      const n=$('sideSearch'); if(n){ n.focus(); try{n.setSelectionRange(n.value.length,n.value.length);}catch(_){}}
    }, 120);
  };
}
$('jobList').addEventListener('click', e=>{
  const btn=e.target.closest('.job-item');
  if(!btn) return;
  selectCase(btn.getAttribute('data-cid'));
});

const nav=document.getElementById('siteNav');
const btn=document.getElementById('navToggle');
if(nav&&btn) btn.addEventListener('click',()=>{
  const open=nav.classList.toggle('is-open');
  btn.setAttribute('aria-expanded', open?'true':'false');
});

(async function init(){
  loadLocal();
  render();
  try{
    const pulled=await pullShared(true);
    if(pulled && pulled.shared){
      if(!cases().length) await ensureSeeded();
    } else if(!cases().length){
      await ensureSeeded();
    }
  }catch(_){
    if(!cases().length) await ensureSeeded();
  }
  render();
  setInterval(()=>pullShared(true), 5000);
})();
})();
</script>
